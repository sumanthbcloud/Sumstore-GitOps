cart:
  replicaCount: 1
  fullnameOverride: cart
  image:
    repository: 961544628309.dkr.ecr.us-east-1.amazonaws.com/sumstore/cart
    tag: 84ac9a389a7f14a33c16fa13480d71df9f21a71c
    pullPolicy: IfNotPresent
  containerPort:
    enabled: true
    port: 8080
  service:
    enabled: true
