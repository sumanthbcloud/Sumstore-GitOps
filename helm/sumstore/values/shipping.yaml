shipping:
  replicaCount: 1
  fullnameOverride: shipping
  image:
    repository: 961544628309.dkr.ecr.us-east-1.amazonaws.com/sumstore/shipping
    tag: e70c43f712aac8a83d663b4ef51e7e545e544a0b
    pullPolicy: IfNotPresent
  containerPort:
    enabled: true
    port: 8080
  service:
    enabled: true
    type: ClusterIP
    port: 8080
    targetPort: 8080
  config:
    CART_ENDPOINT: cart:8080
    DB_HOST: mysql
  existingSecret: shipping-db-secret
  probes:
    startup:
      enabled: true
      path: /health
      initialDelaySeconds: 10
      periodSeconds: 3
      failureThreshold: 30
    readiness:
      enabled: true
      path: /health
      initialDelaySeconds: 5
      periodSeconds: 10
    liveness:
      enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
