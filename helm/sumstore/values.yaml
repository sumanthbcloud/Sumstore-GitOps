# ==============================================================================
# SUM Store Umbrella Values File
# Configures all 8 microservices by nesting service-specific values under alias keys.
# ==============================================================================

cart:
  replicaCount: 1
  fullnameOverride: cart
  image:
    repository: sumanthb9908/sumstore-cart
    tag: 528482677190856017504ac93960f5980564c2d0
    pullPolicy: IfNotPresent
  containerPort:
    enabled: true
    port: 8080
  service:
    enabled: true
    type: ClusterIP
    port: 8080
    targetPort: 8080
  config:
    REDIS_HOST: redis
    CATALOGUE_HOST: catalogue
  probes:
    startup:
      enabled: true
      path: /health
      initialDelaySeconds: 0
      periodSeconds: 2
      failureThreshold: 15
    readiness:
      enabled: true
      path: /health
      initialDelaySeconds: 5
      periodSeconds: 10
    liveness:
      enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

catalogue:
  replicaCount: 1
  fullnameOverride: catalogue
  image:
    repository: sumanthb9908/sumstore-catalogue
    tag: 528482677190856017504ac93960f5980564c2d0
    pullPolicy: IfNotPresent
  containerPort:
    enabled: true
    port: 8080
  service:
    enabled: true
    type: ClusterIP
    port: 8080
    targetPort: 8080
  config:
    CATALOGUE_SERVER_PORT: "8080"
    MONGO_URL: mongodb://mongodb:27017/catalogue
  probes:
    startup:
      enabled: true
      path: /health
      initialDelaySeconds: 0
      periodSeconds: 2
      failureThreshold: 30
    readiness:
      enabled: true
      path: /health
      initialDelaySeconds: 5
      periodSeconds: 10
    liveness:
      enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

dispatch:
  replicaCount: 1
  fullnameOverride: dispatch
  image:
    repository: sumanthb9908/sumstore-dispatch
    tag: 528482677190856017504ac93960f5980564c2d0
    pullPolicy: IfNotPresent
  containerPort:
    enabled: false
  service:
    enabled: false
  config:
    AMQP_HOST: rabbitmq
    DISPATCH_ERROR_PERCENT: "0"
  existingSecret: dispatch-rabbitmq-secret
  probes:
    startup:
      enabled: false
    readiness:
      enabled: false
    liveness:
      enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

payment:
  replicaCount: 1
  fullnameOverride: payment
  image:
    repository: sumanthb9908/sumstore-payment
    tag: 528482677190856017504ac93960f5980564c2d0
    pullPolicy: IfNotPresent
  containerPort:
    enabled: true
    port: 8080
  service:
    enabled: true
    type: ClusterIP
    port: 8080
    targetPort: 8080
  config:
    CART_HOST: cart
    USER_HOST: user
    AMQP_HOST: rabbitmq
  existingSecret: payment-rabbitmq-secret
  probes:
    startup:
      enabled: true
      path: /health
      initialDelaySeconds: 0
      periodSeconds: 2
      failureThreshold: 15
    readiness:
      enabled: true
      path: /health
      initialDelaySeconds: 5
      periodSeconds: 10
    liveness:
      enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

ratings:
  replicaCount: 1
  fullnameOverride: ratings
  image:
    repository: sumanthb9908/sumstore-ratings
    tag: 528482677190856017504ac93960f5980564c2d0
    pullPolicy: IfNotPresent
  containerPort:
    enabled: true
    port: 8080
  service:
    enabled: true
    type: ClusterIP
    port: 8080
    targetPort: 8080
  config:
    APP_ENV: prod
    CATALOGUE_URL: http://catalogue:8080
    PDO_URL: "mysql:host=mysql;dbname=ratings;charset=utf8mb4"
  existingSecret: ratings-db-secret
  probes:
    startup:
      enabled: true
      path: /_health
      initialDelaySeconds: 0
      periodSeconds: 2
      failureThreshold: 20
    readiness:
      enabled: true
      path: /_health
      initialDelaySeconds: 5
      periodSeconds: 10
    liveness:
      enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

shipping:
  replicaCount: 1
  fullnameOverride: shipping
  image:
    repository: sumanthb9908/sumstore-shipping
    tag: 528482677190856017504ac93960f5980564c2d0
    pullPolicy: IfNotPresent
  containerPort:
    enabled: true
    port: 8080
  service:
    enabled: true
    type: ClusterIP
    port: 8080
    targetPort: 8080
  config:
    CART_ENDPOINT: cart:8080
    DB_HOST: mysql
  existingSecret: shipping-db-secret
  probes:
    startup:
      enabled: true
      path: /health
      initialDelaySeconds: 10
      periodSeconds: 3
      failureThreshold: 30
    readiness:
      enabled: true
      path: /health
      initialDelaySeconds: 5
      periodSeconds: 10
    liveness:
      enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

