apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: sumstore-workloads
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: sumstore
spec:
  generators:
    - list:
        elements:
          - service: cart
            chartVersion: 1.0.0
          - service: catalogue
            chartVersion: 1.0.0
          - service: user
            chartVersion: 1.0.0
          - service: shipping
            chartVersion: 1.0.0
          - service: payment
            chartVersion: 1.0.0
          - service: ratings
            chartVersion: 1.0.0
          - service: dispatch
            chartVersion: 1.0.0
          - service: web
            chartVersion: 1.2.0
  template:
    metadata:
      name: "{{service}}"
      namespace: argocd
      labels:
        app.kubernetes.io/name: "{{service}}"
        app.kubernetes.io/part-of: sumstore
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: sumstore
      sources:
        - repoURL: 961544628309.dkr.ecr.us-east-1.amazonaws.com/sumstore/charts
          chart: microservice
          targetRevision: "{{chartVersion}}"
          helm:
            releaseName: "{{service}}"
            valueFiles:
              - $values/apps/{{service}}/values.yaml
        - repoURL: https://github.com/sumanthbcloud/Sumstore-GitOps.git
          targetRevision: main
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: sumstore
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
