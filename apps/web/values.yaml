replicaCount: 1
fullnameOverride: web
image:
  repository: 961544628309.dkr.ecr.us-east-1.amazonaws.com/sumstore/web
  tag: 3ccf1d4712ad2b7d34d61169fba6f8afcbf7762d
  pullPolicy: IfNotPresent
containerPort:
  enabled: true
  port: 8080
service:
  enabled: true
  type: ClusterIP
  port: 8080
  targetPort: 8080
  extraPorts:
    - name: metrics
      port: 9113
      targetPort: 9113
      protocol: TCP
config:
  CATALOGUE_HOST: catalogue
  USER_HOST: user
  CART_HOST: cart
  SHIPPING_HOST: shipping
  PAYMENT_HOST: payment
  RATINGS_HOST: ratings
probes:
  startup:
    enabled: false
  readiness:
    enabled: true
    path: /
    initialDelaySeconds: 5
    periodSeconds: 10
  liveness:
    enabled: true
    path: /
    initialDelaySeconds: 10
    periodSeconds: 10
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi
extraContainers:
  - name: nginx-exporter
    image: nginx/nginx-prometheus-exporter:1.4.1
    imagePullPolicy: IfNotPresent
    ports:
      - name: metrics
        containerPort: 9113
        protocol: TCP
    args:
      - -nginx.scrape-uri=http://127.0.0.1:8080/nginx_status
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 50m
        memory: 32Mi
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
