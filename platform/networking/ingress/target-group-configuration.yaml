apiVersion: gateway.k8s.aws/v1
kind: TargetGroupConfiguration
metadata:
  name: sumstore-tg-config
  namespace: sumstore
  labels:
    app.kubernetes.io/name: sumstore-tg-config
    app.kubernetes.io/part-of: sumstore
    app.kubernetes.io/managed-by: argocd
spec:
  defaultConfiguration:
    targetType: ip
    healthCheckConfig:
      healthCheckPath: /
      matcher:
        httpCode: 200-399
---
apiVersion: gateway.k8s.aws/v1
kind: TargetGroupConfiguration
metadata:
  name: cart-tg-config
  namespace: sumstore
  labels:
    app.kubernetes.io/name: cart-tg-config
    app.kubernetes.io/part-of: sumstore
    app.kubernetes.io/managed-by: argocd
spec:
  targetReference:
    group: ""
    kind: Service
    name: cart
  defaultConfiguration:
    targetType: ip
    healthCheckConfig:
      healthCheckPath: /health
      matcher:
        httpCode: 200-399
