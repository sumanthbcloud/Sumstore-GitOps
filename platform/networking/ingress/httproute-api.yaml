apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sumstore-api
  namespace: sumstore
  labels:
    app.kubernetes.io/name: sumstore-api
    app.kubernetes.io/part-of: sumstore
    app.kubernetes.io/managed-by: argocd
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: sumstore-gateway
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/cart
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - group: ""
          kind: Service
          name: cart
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /api/catalogue
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - group: ""
          kind: Service
          name: catalogue
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /api/payment
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - group: ""
          kind: Service
          name: payment
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /api/ratings
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - group: ""
          kind: Service
          name: ratings
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /api/shipping
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - group: ""
          kind: Service
          name: shipping
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /api/user
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - group: ""
          kind: Service
          name: user
          port: 8080
