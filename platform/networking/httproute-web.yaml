apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sumstore-web
  namespace: sumstore
  labels:
    app.kubernetes.io/name: sumstore-web
    app.kubernetes.io/part-of: sumstore
    app.kubernetes.io/managed-by: argocd
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: sumstore-gateway
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: web
          port: 8080
