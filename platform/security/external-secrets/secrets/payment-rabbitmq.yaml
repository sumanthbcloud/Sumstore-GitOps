apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: payment-rabbitmq-secret
  namespace: sumstore
  labels:
    app.kubernetes.io/name: payment
    app.kubernetes.io/part-of: sumstore
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: sumstore-secretsmanager
    kind: ClusterSecretStore
  target:
    name: payment-rabbitmq-secret
    creationPolicy: Owner
  data:
    - secretKey: AMQP_USER
      remoteRef:
        key: sumstore/rabbitmq
        property: RABBITMQ_DEFAULT_USER
    - secretKey: AMQP_PASS
      remoteRef:
        key: sumstore/rabbitmq
        property: RABBITMQ_DEFAULT_PASS
