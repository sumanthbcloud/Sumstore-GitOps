apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: user-secret
  namespace: sumstore
  labels:
    app.kubernetes.io/name: user
    app.kubernetes.io/part-of: sumstore
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: sumstore-secretsmanager
    kind: ClusterSecretStore
  target:
    name: user-secret
    creationPolicy: Owner
    template:
      data:
        MONGO_URL: "mongodb://{{ .mongo_username }}:{{ .mongo_password }}@mongodb:27017/users?authSource=admin"
        REDIS_PASSWORD: "{{ .redis_password }}"
  data:
    - secretKey: mongo_username
      remoteRef:
        key: sumstore/mongodb
        property: username
    - secretKey: mongo_password
      remoteRef:
        key: sumstore/mongodb
        property: password
    - secretKey: redis_password
      remoteRef:
        key: sumstore/redis
        property: password
