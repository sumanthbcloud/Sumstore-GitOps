apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: shipping-db-secret
  namespace: sumstore
  labels:
    app.kubernetes.io/name: shipping
    app.kubernetes.io/part-of: sumstore
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: sumstore-secretsmanager
    kind: ClusterSecretStore
  target:
    name: shipping-db-secret
    creationPolicy: Owner
  data:
    - secretKey: DB_USER
      remoteRef:
        key: sumstore/mysql
        property: SHIPPING_DB_USER
    - secretKey: DB_PASSWORD
      remoteRef:
        key: sumstore/mysql
        property: SHIPPING_DB_PASSWORD
