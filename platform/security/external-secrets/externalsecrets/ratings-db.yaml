apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ratings-db-secret
  namespace: sumstore
  labels:
    app.kubernetes.io/name: ratings
    app.kubernetes.io/part-of: sumstore
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: sumstore-secretsmanager
    kind: ClusterSecretStore
  target:
    name: ratings-db-secret
    creationPolicy: Owner
  data:
    - secretKey: PDO_USER
      remoteRef:
        key: sumstore/mysql
        property: RATINGS_DB_USER
    - secretKey: PDO_PASSWORD
      remoteRef:
        key: sumstore/mysql
        property: RATINGS_DB_PASSWORD
