apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: sumstore-secretsmanager
  labels:
    app.kubernetes.io/part-of: sumstore
    app.kubernetes.io/component: secret-store
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      # Authentication Architecture:
      # Primary (Recommended): EKS Pod Identity
      # With EKS Pod Identity, the AWS SDK default credentials chain in the External Secrets
      # Operator controller pod automatically discovers IAM credentials via the injected
      # AWS_CONTAINER_CREDENTIALS_FULL_URI environment variable and token file provided by
      # the EKS Pod Identity Agent add-on. No static AWS access keys or hardcoded role ARNs
      # are stored in the cluster.
      #
      # Alternative (IRSA):
      # If using IAM Roles for Service Accounts (IRSA), uncomment the serviceAccountRef below:
      # auth:
      #   jwt:
      #     serviceAccountRef:
      #       name: external-secrets
      #       namespace: external-secrets
