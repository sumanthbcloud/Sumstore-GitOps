          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "sum(up{namespace=~\"$namespace\", job=~\".*$service.*\"}) or vector(0)",
