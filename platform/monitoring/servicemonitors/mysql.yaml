apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mysql
  namespace: sumstore
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/name: mysql
    app.kubernetes.io/part-of: sumstore
    app.kubernetes.io/component: metrics
spec:
  namespaceSelector:
    matchNames:
      - sumstore
  selector:
    matchLabels:
      app.kubernetes.io/name: mysql
      app.kubernetes.io/component: database
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
