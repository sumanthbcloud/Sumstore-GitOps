apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: shipping
  namespace: sumstore
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/name: shipping
    app.kubernetes.io/part-of: sumstore
    app.kubernetes.io/component: metrics
spec:
  namespaceSelector:
    matchNames:
      - sumstore
  selector:
    matchLabels:
      app.kubernetes.io/name: "microservice"
      app.kubernetes.io/instance: "shipping"
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
      scrapeTimeout: 10s
