apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: web
  namespace: sumstore
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: sumstore
    app.kubernetes.io/component: metrics
spec:
  namespaceSelector:
    matchNames:
      - sumstore
  selector:
    matchLabels:
      app.kubernetes.io/name: "microservice"
      app.kubernetes.io/instance: "web"
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
