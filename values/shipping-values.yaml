replicaCount: 1
fullnameOverride: shipping
image:
  repository: sumanthb9908/sumstore-shipping
  tag: 528482677190856017504ac93960f5980564c2d0
  pullPolicy: IfNotPresent
containerPort:
  enabled: true
  port: 8080
service:
  enabled: true
  type: ClusterIP
  port: 8080
  targetPort: 8080
config:
  CART_ENDPOINT: cart:8080
  DB_HOST: mysql
existingSecret: shipping-db-secret
probes:
  startup:
    enabled: true
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 3
    failureThreshold: 30
  readiness:
    enabled: true
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
  liveness:
    enabled: false
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi
