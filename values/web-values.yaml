replicaCount: 1

image:
  repository: sumstore/web
  tag: latest
  pullPolicy: IfNotPresent

containerPort:
  enabled: true
  port: 8080

service:
  enabled: true
  type: ClusterIP
  port: 8080
  targetPort: 8080

config:
  CATALOGUE_HOST: catalogue
  USER_HOST: user
  CART_HOST: cart
  SHIPPING_HOST: shipping
  PAYMENT_HOST: payment
  RATINGS_HOST: ratings

existingSecret: ""

probes:
  startup:
    enabled: false
  readiness:
    enabled: true
    path: /
    initialDelaySeconds: 5
    periodSeconds: 10
  liveness:
    enabled: true
    path: /
    initialDelaySeconds: 10
    periodSeconds: 10

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi
