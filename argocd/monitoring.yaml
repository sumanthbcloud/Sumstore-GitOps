apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: sumstore
    app.kubernetes.io/component: monitoring
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: sumstore
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 92.14.1
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/platform/monitoring/values.yaml
    - repoURL: https://github.com/sumanthbcloud/Sumstore-GitOps.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/sumanthbcloud/Sumstore-GitOps.git
      targetRevision: main
      path: platform/monitoring/servicemonitors
    - repoURL: https://github.com/sumanthbcloud/Sumstore-GitOps.git
      targetRevision: main
      path: platform/monitoring/dashboards
    - repoURL: https://github.com/sumanthbcloud/Sumstore-GitOps.git
      targetRevision: main
      path: platform/monitoring/alerts
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
