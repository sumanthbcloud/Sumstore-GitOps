apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: sumstore
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: sumstore
spec:
  description: Argo CD Project for SUM Store microservices and platform workloads
  sourceRepos:
    - 'https://github.com/sumanthbcloud/Sumstore-GitOps.git'
    - '961544628309.dkr.ecr.us-east-1.amazonaws.com/sumstore/charts'
    - 'https://prometheus-community.github.io/helm-charts'
  destinations:
    - namespace: sumstore
      server: https://kubernetes.default.svc
    - namespace: external-secrets
      server: https://kubernetes.default.svc
    - namespace: kube-system
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc
    - namespace: monitoring
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: 'external-secrets.io'
      kind: ClusterSecretStore
    - group: 'generators.external-secrets.io'
      kind: ClusterGenerator
    - group: 'generators.external-secrets.io'
      kind: ECRAuthorizationToken
    - group: 'storage.k8s.io'
      kind: StorageClass
    - group: gateway.networking.k8s.io
      kind: GatewayClass
    - group: 'rbac.authorization.k8s.io'
      kind: ClusterRole
    - group: 'rbac.authorization.k8s.io'
      kind: ClusterRoleBinding
    - group: 'admissionregistration.k8s.io'
      kind: MutatingWebhookConfiguration
    - group: 'admissionregistration.k8s.io'
      kind: ValidatingWebhookConfiguration
    - group: 'apiextensions.k8s.io'
      kind: CustomResourceDefinition
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
